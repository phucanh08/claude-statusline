name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash   # Git Bash on windows-latest
    steps:
      # Keep LF endings on Windows: the scripts and test/golden/*.out are compared byte for byte.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # test 4c reads the 09f538a base script from history on macOS
      - name: Tool versions
        run: |
          uname -a
          bash --version | head -1
          jq --version
      - name: Test suite
        run: sh test/run.sh
