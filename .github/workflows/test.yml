name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, autocrlf=${{ matrix.autocrlf }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        autocrlf: [false]
        include:
          # A Windows clone with Git's default core.autocrlf=true: .gitattributes must
          # still check everything out with LF.
          - os: windows-latest
            autocrlf: true
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash   # Git Bash on windows-latest
    steps:
      # The scripts and test/golden/*.out are compared byte for byte; .gitattributes
      # keeps them LF whatever this is set to.
      - run: git config --global core.autocrlf ${{ matrix.autocrlf }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # test 4c reads the 09f538a base script from history on macOS
      - name: Working tree is LF
        run: |
          echo "core.autocrlf=$(git config core.autocrlf)"
          git ls-files --eol
          crlf=$(git ls-files --eol | grep -c 'w/crlf' || true)
          echo "CRLF files in the working tree: $crlf"
          [ "$crlf" -eq 0 ]
      - name: Tool versions
        run: |
          uname -a
          bash --version | head -1
          jq --version
      - name: Test suite
        run: sh test/run.sh
